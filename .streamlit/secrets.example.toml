# Modelo de configuração de acesso.
# Copie para secrets.toml e substitua os hashes. O arquivo secrets.toml
# é ignorado pelo Git e nunca deve ser versionado.
#
# Para gerar o hash de uma senha:
#   python -c "import getpass, hashlib; print(hashlib.sha256(getpass.getpass('Senha: ').encode()).hexdigest())"

[credenciais.usuario]
nome = "Nome Completo"
papel = "Cargo"
senha_hash = "hash sha-256 da senha"